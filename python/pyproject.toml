[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "symphonyqg"
version = "0.1.0"
description = "SymphonyQG: Symphonious Integration of Quantization and Graph for Approximate Nearest Neighbor Search"
authors = [{ name = "Yutong Gou" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.uv]
no-build-isolation-package = ["symphonyqg"]
